[package]
name = "ctnd"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
description = "Attend public-room state machine"
repository = "https://git.corbet.ch/corbet-libre/ctnd.git"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = "1"
cgrp = { git = "https://git.corbet.ch/corbet-libre/cgrp.git", branch = "main" }

[dev-dependencies]
cwst = { git = "https://git.corbet.ch/corbet-libre/cwst.git", branch = "main" }
futures = "0.3"
ckmg = { git = "https://git.corbet.ch/corbet-libre/ckmg.git", branch = "main" }
ed25519-dalek = "3"
postcard = { version = "1", default-features = false, features = ["alloc"] }
wasm-bindgen-test = "0.3"
