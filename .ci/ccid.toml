schema = 1
project = "ctnd"
repository = "https://git.corbet.ch/corbet-foss/ctnd.git"

[checks.resolve]
kind = "commands"
commands = [["bash", ".ci/check.sh", "resolve"]]

[checks.native]
kind = "commands"
commands = [["bash", ".ci/check.sh", "native"]]

[checks.browser]
kind = "commands"
commands = [["bash", ".ci/check.sh", "browser"]]

[checks.coverage]
kind = "commands"
commands = [["bash", ".ci/check.sh", "coverage"]]

[checks.dependency-policy]
kind = "commands"
commands = [["bash", ".ci/check.sh", "dependency-policy"]]

[checks.lt-rooms]
kind = "commands"
commands = [["python3", ".ci/lt-rooms.py"]]

# Pre-existing checks above preserved verbatim; hosted Linux gates appended below.
[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["node", "--version"], ["jq", "--version"], ["curl", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_outputs = ["coverage.json"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[render]
tool_revision = "53c129c2efa3b9279d2ecbc237d15acdfb656d8c"

[jobs.verify]
scheduler = "crow"
checks = ["verify", "advisories"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[push_consumer.cmsg-v01]
consumer = "https://git.corbet.ch/corbet-libs/cmsg.git"
branch = "v01"
consumer_branch = "v01"
job = "v01-push"
self_name = "ctnd"
