# Generated by ccid render v1; edit .ci/ccid.toml instead.
# Dependency push fan-out: this repository's push event runs the consumer's
# repository-owned job under the same shared coalescing (no worker clone
# here either; the Rust command stages the consumer). The consumer's
# resolved lock must contain the event commit afterwards, or the run fails.
when:
  - event: push
    branch: v01
labels:
  backend: local
skip_clone: true
variables:
  CI_MIN_AVAILABLE_MB: {default: "8192"}
  CI_MEMORY_MB: {default: "8192"}
  CI_MEMORY_PER_JOB_MB: {default: "2048"}
steps:
  - name: push-consumer
    image: bash
    environment:
      CCID_REVISION: 'e38f347d6941aa105ac4b55a0d4b8fec2ef22433'
      CI_TOOL_BINARY: {from_secret: CI_TOOL_BINARY_STATIC}
      CI_TOOL_BINARY_SHA256: {from_secret: CI_TOOL_BINARY_SHA256_STATIC}
    commands:
      - |
        set -eu
        printf '%s  %s\n' "$CI_TOOL_BINARY_SHA256" "$CI_TOOL_BINARY" | sha256sum --check --strict
        test "$("$CI_TOOL_BINARY" source-revision)" = "$CCID_REVISION"
        "$CI_TOOL_BINARY" push-run --consumer-url "https://git.corbet.ch/corbet-libs/cmsg.git" --consumer-branch "v01" --job "v01-push" --trigger-kind dep --trigger-sha "$CI_COMMIT_SHA" --trigger-name "ctnd" --trigger-branch "$CI_COMMIT_BRANCH" --trigger-repo "https://git.corbet.ch/corbet-foss/ctnd.git"
