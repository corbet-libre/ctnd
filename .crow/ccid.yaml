# Run only explicitly selected checks with the verified shared command library.
when:
  - event: manual
skip_clone: true
variables:
  SOURCE_ARCHIVE: {default: ""}
  SOURCE_SHA256: {default: ""}
  CI_TOOL_ARCHIVE: {default: ""}
  CI_TOOL_SHA256: {default: ""}
  CI_TOOL_BINARY: {default: ""}
  CI_TOOL_BINARY_SHA256: {default: ""}
  CHECKS: {default: lt-rooms}
  CI_JOBS: {default: "2"}
  CI_TEST_THREADS: {default: "2"}
  CI_MEMORY_MB: {default: ""}
  CI_MEMORY_PER_JOB_MB: {default: ""}
  CI_MIN_AVAILABLE_MB: {default: "8192"}
  CI_REPOSITORY_URL: {default: ""}
  CI_TIMEOUT: {default: "3600"}
  CI_CACHE_ROOT: {default: ""}
  CARGO_TARGET_DIR: {default: ""}
  CI_NIX_JOBS: {default: ""}
  CI_LINKER: {default: system}
  TMPDIR: {default: ""}
  ARTIFACT_ROOT: {default: ""}
  LT_ROOMS_DRIVER: {default: ""}
  LT_ROOMS_DRIVER_SHA256: {default: ""}
  LT_ROOMS_OUTPUT: {default: ""}
  DEPENDENCY_MANIFEST: {default: ""}
  DEPENDENCY_MANIFEST_SHA256: {default: ""}
steps:
  - name: selected-checks
    image: bash
    environment:
      LT_ROOMS_EXECUTOR: crow
      CCID_REVISION: '6f5db431f5135c4b35a8cf36adcdc3721a72ee3b'
    commands:
      - |
        set -eu
        printf '%s  %s\n' "$CI_TOOL_SHA256" "$CI_TOOL_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$CI_TOOL_ARCHIVE")" = "$CCID_REVISION"
        test -n "$CI_TOOL_BINARY"
        test -n "$CI_TOOL_BINARY_SHA256"
        printf '%s  %s\n' "$CI_TOOL_BINARY_SHA256" "$CI_TOOL_BINARY" | sha256sum --check --strict
        test "$("$CI_TOOL_BINARY" source-revision)" = "$CCID_REVISION"
        TMPDIR="$${TMPDIR:-/tmp}"
        export TMPDIR
        exec "$CI_TOOL_BINARY" check --archive "$SOURCE_ARCHIVE" --sha256 "$SOURCE_SHA256" --commit "$CI_COMMIT_SHA" --check "$CHECKS"
