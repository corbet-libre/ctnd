name: ci
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: substantive-ci
  cancel-in-progress: false
  queue: max
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo update
      - run: cargo metadata --locked --format-version 1 > dependency-metadata.json
      - run: rustc --version --verbose > resolution.txt
      - run: date --utc --iso-8601=seconds >> resolution.txt
      - uses: actions/upload-artifact@v7
        with:
          name: resolved-lock
          path: |
            Cargo.lock
            dependency-metadata.json
            resolution.txt
  check:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: resolved-lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: python3 .ci/lt-rooms.py --validate-contract
      - name: Format
        run: |
          cargo fmt --all
          git diff -- '*.rs' > rustfmt.patch
          test ! -s rustfmt.patch
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: formatting
          path: rustfmt.patch
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Matching wasm runner
        run: |
          version=$(jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' dependency-metadata.json)
          archive="wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}"
          mkdir -p "$RUNNER_TEMP/wasm-runner"
          cd "$RUNNER_TEMP/wasm-runner"
          curl --fail --location --retry 3 --remote-name "$base/$archive"
          curl --fail --location --retry 3 --remote-name "$base/$archive.sha256sum"
          checksum=$(cut -d ' ' -f1 "$archive.sha256sum")
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          tar -xzf "$archive" --strip-components=1
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run device vectors in wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked --target wasm32-unknown-unknown --tests
  dependency-policy:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: resolved-lock
      - run: python3 .github/check-first-party.py
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories
  coverage:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: resolved-lock
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --locked --branch --json --output-path coverage.json --ignore-filename-regex '/tests/'
      - run: python3 .github/check-coverage.py coverage.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.json
